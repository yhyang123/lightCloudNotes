services:
  nascloudnote:
    build: .
    # 明确锁定版本号，避免 latest 被后续版本覆盖时行为漂移
    image: nascloudnote:1.4.0
    container_name: nascloudnote
    restart: unless-stopped
    ports:
      - "3000:3000"          # 左边改成 NAS 上空闲的端口
    volumes:
      - ./data:/app/data     # 笔记数据库 + 上传图片的持久化目录，建议指向 NAS 共享文件夹
    environment:
      - PORT=3000
      - DATA_DIR=/app/data
