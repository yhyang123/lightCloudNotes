<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#316dca">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>nasCloudNote · 云笔记</title>
<link rel="stylesheet" href="/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📝</text></svg>">
</head>
<body>
<div id="app">
  <!-- 顶栏 -->
  <header class="topbar">
    <div class="brand">📝 nasCloudNote</div>
    <div class="topbar-actions">
      <button id="btnAutoLock" class="btn ghost" title="自动上锁设置">🔒 <span id="autoLockLabel">5 分钟</span></button>
      <button id="btnSearch" class="btn ghost" title="搜索">🔍 搜索</button>
      <button id="btnTrash" class="btn ghost" title="回收站" aria-label="回收站">♻</button>
    </div>
  </header>

  <div class="main">
    <!-- 侧栏：文件夹树 + 笔记列表 -->
    <aside class="sidebar collapsible" id="sidebar">
      <div class="sidebar-head">
        <div class="sidebar-head-actions">
          <select id="sortMode" class="sort-select" title="排序方式" aria-label="排序方式">
            <option value="time">按修改时间</option>
            <option value="name">按名称</option>
            <option value="custom">自定义顺序</option>
          </select>
          <button id="btnNewNote" class="btn icon" title="新笔记">📝</button>
          <button id="btnNewRootFolder" class="btn icon" title="新建根文件夹">📁＋</button>
          <button id="btnCollapseSidebar" class="btn icon collapse-btn" title="收起侧栏">◀</button>
        </div>
      </div>
      <div class="tree" id="folderTree"></div>
    </aside>
    <div class="resizer" id="resizerSidebar" data-target="sidebar"></div>
    <div class="sidebar-mask hidden" id="sidebarMask"></div>

    <!-- 右栏：编辑器 -->
    <section class="editor" id="editorPane">
      <div class="editor-head-top">
        <button id="btnExpandSidebar" class="btn icon collapse-btn hidden" title="展开侧栏">☰</button>
        <span id="currentFolderName" class="crumb"></span>
        <div class="editor-actions">
          <span id="noteMeta" class="note-meta"></span>
          <button id="btnToggleToolbar" class="btn ghost sm" type="button" aria-controls="toolbar" aria-expanded="true" title="收起格式工具栏">⌃ 收起工具栏</button>
          <button id="btnExportMarkdown" class="btn ghost sm hidden">⤓ MD</button>
          <button id="btnExportPdf" class="btn ghost sm" title="导出为 PDF（打开打印对话框后选择「另存为 PDF」）">⤓ PDF</button>
        </div>
      </div>
      <div class="editor-empty" id="editorEmpty">
        <div class="empty-icon">📝</div>
        <p>点击左侧文件夹中的笔记查看，或点侧栏顶部「📝」新建</p>
      </div>
      <div class="editor-main hidden" id="editorMain">
        <div class="editor-head">
          <input id="noteTitle" class="note-title-input" placeholder="笔记标题" maxlength="200" title="点击可直接修改笔记名称">
          <button id="btnToggleHeader" class="btn ghost sm" type="button" aria-expanded="true" aria-label="收起顶部栏" title="收起顶部栏">⌃</button>
          <button id="btnToggleEdit" class="btn primary sm btn-edit">✏️ 编辑</button>
        </div>
        <div class="toolbar" id="toolbar">
          <button class="tb" data-cmd="bold" title="加粗 (Ctrl+B)"><b>B</b></button>
          <select id="blockType" class="tb-select" title="段落类型">
            <option value="p">正文</option>
            <option value="h1">标题 1</option>
            <option value="h2">标题 2</option>
            <option value="h3">标题 3</option>
            <option value="blockquote">引用</option>
            <option value="pre">代码块</option>
          </select>
          <button class="tb toolbar-group-toggle" type="button" aria-controls="textTools" aria-expanded="false">文字⌄</button>
          <div id="textTools" class="toolbar-panel hidden" role="group" aria-label="文字样式">
          <button class="tb" data-cmd="italic" title="斜体 (Ctrl+I)"><i>I</i></button>
          <button class="tb" data-cmd="underline" title="下划线 (Ctrl+U)"><u>U</u></button>
          <button class="tb" data-cmd="strikeThrough" title="删除线"><s>S</s></button>
          <span class="tb-sep"></span>
          <select id="fontSize" class="tb-select" title="字体大小">
            <option value="" disabled selected hidden>Aa</option>
            <option value="1">特小</option>
            <option value="2">较小</option>
            <option value="3">正常</option>
            <option value="4">中号</option>
            <option value="5">较大</option>
            <option value="6">大号</option>
            <option value="7">特大</option>
          </select>
          <span class="color-control" data-color-command="foreColor">
            <button class="tb color-apply" id="btnForeColor" type="button" title="应用当前文字颜色">
              <span class="color-letter">A</span><span class="color-bar" style="--picked-color:#d9483b"></span>
            </button>
            <button class="tb color-menu-btn" type="button" title="选择文字颜色" aria-label="选择文字颜色" aria-expanded="false">⌄</button>
            <input type="color" id="colorFore" value="#d9483b" class="color-native-input" aria-label="自定义文字颜色">
          </span>
          <span class="color-control" data-color-command="hiliteColor">
            <button class="tb color-apply color-highlight" id="btnBackColor" type="button" title="应用当前高亮颜色">
              <span class="color-letter">A</span><span class="color-bar" style="--picked-color:#ffe066"></span>
            </button>
            <button class="tb color-menu-btn" type="button" title="选择高亮颜色" aria-label="选择高亮颜色" aria-expanded="false">⌄</button>
            <input type="color" id="colorBack" value="#ffe066" class="color-native-input" aria-label="自定义高亮颜色">
          </span>
          </div>
          <button class="tb toolbar-group-toggle" type="button" aria-controls="paragraphTools" aria-expanded="false">段落⌄</button>
          <div id="paragraphTools" class="toolbar-panel hidden" role="group" aria-label="段落排版">
          <button class="tb" data-cmd="insertUnorderedList" title="无序列表">• 列表</button>
          <button class="tb" data-cmd="insertOrderedList" title="有序列表">1. 列表</button>
          </div>
          <button class="tb" id="btnImage" type="button" title="插入图片" aria-label="插入图片">🖼️</button>
          <button class="tb toolbar-group-toggle" type="button" aria-controls="insertTools" aria-expanded="false">插入⌄</button>
          <div id="insertTools" class="toolbar-panel hidden" role="group" aria-label="插入内容">
          <button class="tb" id="btnLink" title="插入链接">🔗</button>
          <button class="tb" id="btnTable" title="插入表格">▦ 表格</button>
          <button class="tb" id="btnCode" title="插入代码块">&lt;/&gt; 代码</button>
          <button class="tb" id="btnHr" title="分隔线">—</button>
          <button class="tb" id="btnMarkdownHelp" title="富文本 Markdown 快捷语法">M↓ 快捷语法</button>
          <button class="tb" id="btnRedo" title="重做 (Ctrl+Shift+Z)">↪ 重做</button>
          </div>
          <span class="tb-flex"></span>
          <button class="tb" id="btnUndo" title="撤销 (Ctrl+Z)">↩</button>
        </div>
        <div class="editor-scroll">
          <div id="markdownTools" class="markdown-tools hidden">
            <strong>Markdown</strong>
            <span>源码编辑 · 自动保存</span>
            <button id="btnMarkdownImage" class="btn ghost sm">插入图片</button>
            <button id="btnMarkdownPreview" class="btn ghost sm" aria-pressed="true">预览：开</button>
          </div>
          <div id="markdownWorkspace" class="markdown-workspace">
          <textarea id="markdownSource" class="markdown-source hidden" aria-label="Markdown 源码" placeholder="# 标题&#10;&#10;在这里编写 Markdown…" spellcheck="false"></textarea>
          <div id="editor" class="editor-content" contenteditable="true" spellcheck="false"></div>
          </div>
        </div>
        <div class="editor-foot">
          <span id="saveStatus" class="save-status">就绪</span>
          <span class="readonly-badge hidden" id="readonlyBadge">只读模式</span>
          <span class="autosave-hint">自动保存已开启</span>
          <div>
            <button id="btnDeleteNote" class="btn danger ghost sm">🗑 删除</button>
          </div>
        </div>
      </div>
    </section>
  </div>
</div>

<!-- 通用对话框 -->
<div class="modal-mask hidden" id="modalMask">
  <div class="modal" id="modalBox">
    <div class="modal-title" id="modalTitle"></div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot">
      <button class="btn ghost" id="modalCancel">取消</button>
      <button class="btn primary" id="modalOk">确定</button>
    </div>
  </div>
</div>

<div id="toastBox"></div>
<input type="file" id="fileInput" accept="image/*" multiple hidden>

<!-- 文件/文件夹右键菜单 -->
<div id="contextMenu" class="context-menu hidden" role="menu" aria-label="快捷操作">
  <button type="button" id="contextRename" role="menuitem"><span>✏️</span><span>重命名</span></button>
  <button type="button" id="contextPin" role="menuitem"><span>📌</span><span>置顶</span></button>
  <button type="button" id="contextPass" role="menuitem"><span>🔑</span><span>设置密码</span></button>
  <button type="button" id="contextMove" role="menuitem"><span>📁</span><span>移动到…</span></button>
</div>

<!-- 选中文字浮动气泡 -->
<div id="selBubble" class="sel-bubble hidden">
  <button class="sb-btn" data-cmd="bold" title="加粗"><b>B</b></button>
  <button class="sb-btn" data-cmd="italic" title="斜体"><i>I</i></button>
  <button class="sb-btn" data-cmd="underline" title="下划线"><u>U</u></button>
  <span class="sb-sep"></span>
  <select class="sb-select" id="sbFont" title="字体大小">
    <option value="" hidden selected>A</option>
    <option value="1">12</option>
    <option value="2">13</option>
    <option value="3">16</option>
    <option value="4">18</option>
    <option value="5">24</option>
    <option value="6">32</option>
    <option value="7">48</option>
  </select>
  <label class="sb-color" title="文字颜色">
    <span class="sb-dot fore"></span>
    <input type="color" id="sbFore" value="#d9483b" aria-label="选择文字颜色">
  </label>
  <label class="sb-color" title="背景高亮">
    <span class="sb-dot back"></span>
    <input type="color" id="sbBack" value="#ffe066" aria-label="选择背景高亮颜色">
  </label>
</div>

<!-- 链接浮动气泡 -->
<div id="linkBubble" class="float-bar hidden">
  <span class="fb-text" id="lbUrl" title=""></span>
  <span class="sb-sep"></span>
  <button class="sb-btn" data-act="open" title="在新标签页打开">↗</button>
  <button class="sb-btn" data-act="copy" title="复制链接地址">⧉</button>
  <button class="sb-btn" data-act="edit" title="编辑链接">✏️</button>
  <button class="sb-btn" data-act="unlink" title="移除链接（保留文字）">✕</button>
</div>

<!-- 表格浮动工具条 -->
<div id="tableBar" class="float-bar hidden">
  <button class="sb-btn" data-act="rowAbove" title="在上方插入一行">⬆行</button>
  <button class="sb-btn" data-act="rowBelow" title="在下方插入一行">⬇行</button>
  <button class="sb-btn" data-act="rowDel" title="删除当前行">✕行</button>
  <span class="sb-sep"></span>
  <button class="sb-btn" data-act="colLeft" title="在左侧插入一列">⬅列</button>
  <button class="sb-btn" data-act="colRight" title="在右侧插入一列">➡列</button>
  <button class="sb-btn" data-act="colDel" title="删除当前列">✕列</button>
  <span class="sb-sep"></span>
  <button class="sb-btn danger" data-act="tableDel" title="删除整个表格">🗑</button>
</div>

<!-- 代码块浮动工具条 -->
<div id="codeBar" class="float-bar hidden">
  <span class="fb-text" id="cbLang"></span>
  <span class="sb-sep"></span>
  <button class="sb-btn" data-act="lang" title="修改代码语言">语言</button>
  <button class="sb-btn" data-act="copy" title="复制代码内容">复制</button>
  <button class="sb-btn" data-act="exit" title="在代码块下方新建段落">退出 ↵</button>
  <button class="sb-btn danger" data-act="del" title="删除整个代码块">🗑</button>
</div>

<!-- 图片浮动工具条 -->
<div id="imageBar" class="float-bar hidden">
  <button class="sb-btn" data-act="small" title="小图（240px）">小</button>
  <button class="sb-btn" data-act="medium" title="中图（420px）">中</button>
  <button class="sb-btn" data-act="large" title="大图（640px）">大</button>
  <button class="sb-btn" data-act="full" title="原始尺寸（不超过正文宽度）">原图</button>
  <span class="sb-sep"></span>
  <button class="sb-btn" data-act="rotl" title="向左旋转 90°">↺</button>
  <button class="sb-btn" data-act="rotr" title="向右旋转 90°">↻</button>
  <span class="sb-sep"></span>
  <button class="sb-btn" data-act="zoom" title="放大查看">🔍</button>
  <button class="sb-btn danger" data-act="del" title="删除图片">🗑</button>
</div>

<!-- 图片放大浮窗（点击遮罩或 Esc 关闭） -->
<div id="imgLightbox" class="img-lightbox hidden" role="dialog" aria-label="图片预览">
  <img id="imgLightboxPic" src="" alt="">
</div>

<script src="/vendor/marked-15.0.12.min.js"></script>
<script src="/vendor/purify-3.2.7.min.js"></script>
<script src="/markdown.js"></script>
<script src="/markdown-shortcuts.js"></script>
<script src="/app.js"></script>
</body>
</html>
